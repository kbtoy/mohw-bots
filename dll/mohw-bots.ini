; mohw-bots settings - put next to xinput1_3.dll in the game folder.
; Key codes are Windows virtual-key codes, written in decimal (F7=118, F8=119, F9=120, F11=122).
[bots]
; F8 = add a bot at a spawn point the engine picks
KeyAddBot=119
; F7 = add a bot 3 m in front of your soldier
KeyAddBotAtMe=118
; F9 = pause / resume the bot brain (paused bots stand still and hold fire)
KeyToggleMove=120
; F11 = write all players and bots to mohw-bots.log
KeyDump=122
; F6 = add a bot on your team at a spawn point the engine picks
KeyAddFriendlyBot=117
; 0 = opposite of your team, otherwise a team id (1 or 2)
Team=0
; Team for you (human players). Offline nobody assigns one, you stay on team 0 and can't spawn ("Falling back").
; 1 or 2; 0 = leave it to the game.
HumanTeam=1
; index into the team's SoldierCustomization (kit) list; -1 = a random kit per bot
KitIndex=-1
; 0 = Soldier (what the game gives human players), else CustomizedSoldier; 1 = Soldier; 2 = CustomizedSoldier
; (CustomizedSoldier bots were invisible and took no damage - it looks like the deploy screen's preview body)
Blueprint=0
; Default loadout given to each bot from its kit (the soldier's body comes from these):
; 0 = none (invisible bots), 1 = kit + appearance only (no weapons),
; 2 = the game's own default loadout for the kit (weapons with default attachments + appearance), falling back to 1
;     if it leaves no appearance
Unlocks=2
; seconds before a killed bot comes back (same name and team; 0 = never). With KeepPlayers=0 the game deletes the
; dead bot's player and it returns as a new one.
AutoRespawnSeconds=5
; 1 = run each bot soldier's movement physics every tick (as fun-bots does); with 0 bots turn but never walk
AlwaysStep=1
; 1 = pair players into fireteams (you with a bot on your team, the other bots with each other). Offline nobody
; assigns them, so "your buddy" was just the first teammate in the list and the buddy bonus went to whoever that was.
Fireteams=1
; MOHW's spawn rule for bots too: 1 = a bot spawns next to its fireteam buddy when the buddy is out of combat (no
; enemy within BuddySafeMeters or in sight, not fighting lately), otherwise it falls back to a spawn point the game
; picks away from enemies' sight. 0 = always the fall-back spawn.
SpawnOnBuddy=1
BuddySafeMeters=25
; 1 = a bot's fall-back spawn uses its own team's spawn points only (its base). MP_03 TDM lets anyone use any point
; (the level's spawn chooser has its team filter off), so bots spawned in the other team's base. 0 = the game's pick.
FallBackToOwnBase=1
; 1 = when a team's base is being camped, its bots spawn on the map's shared points instead, until it has been clear for 15 s.
; Needs FallBackToOwnBase=1. 0 = always their own base.
SharedSpawnWhenCamped=1
; Camped means this many living enemies within 30 m of the base (0 = don't look at this)...
CampedEnemies=2
; ...staying there for this many seconds...
CampedSeconds=10
; ...or this many of the team killed there within 15 s of spawning, in the last 30 s (0 = don't look at this).
CampedSpawnDeaths=3
; A shared point this close to an enemy isn't used. If none is left, the bot uses its own base after all.
SharedSpawnSafeMeters=25
; 1 = Demolitions bots carry the Support kit's V40 mini grenades instead of remote charges (bots never switch to the
; detonator, so their charges never went off). 0 = the kit as it is.
DemoMiniGrenades=1
; 1 = a dead bot keeps its player and respawns as itself, as you do: same name, team, kit, fireteam and scoreboard row.
; The game deletes an AI player as soon as it dies (a campaign rule), so every bot death made a new player - nothing
; on the scoreboard could last, and your game deleted the player a falling body belonged to (likely the bodies seen
; going limp and sliding about). 0 = the game's own behaviour: a dead bot comes back as a new player.
KeepPlayers=1
; 1 = bots get a scoreboard row: name, kills, deaths, points (a kill 100, +50 for a headshot, as [scoring] gives you).
; The game makes a row only for players that aren't AI. Also: your own points (offline the game left them at 0), the
; match totals the end-of-round screens show (best fireteam, results), and bot names on the "killed by" card.
; 0 = no rows for bots.
Scoreboard=1
; Players per team: bots fill both teams up to this once you have a team (you count on yours: 10 = you + 9 bots
; against 10 bots), one every 0.4 s. F6 / F7 / F8 still add more. 0 = bots only by key.
TeamSize=10
; Bot names, comma-separated: a new bot takes a random one not in use (numbers like Bot07 once all are taken)
Names=Dingus,Ol Red,Slick,Rufus,Drumstick,Crackers,Doug,Witou Low,Wang Chung,Ventura,Meathead,Ooga Booga,Sumting Wong,Billy,Whatta Chatta,Barttle Doo,Left Eye,Cornwallas,Jones
; 1 = the server animates soldiers whatever its game type. It normally does so only for "multiplayer"; without it
; no soldier's server-side hit shapes move, and bot bullets passed through other bots (66-82% of them crossed the
; target's body, 1-9% of those registered). 0 = the game's own behaviour. If the game crashes loading a level, try 0.
ForceServerAnimation=1
; 1 = the server applies a bot's bullet hits on other bots itself. The offline match runs as "coop", where the server
; drops its own hits from AI shooters and waits for a player's game to report them - so bot-vs-bot fights you weren't
; watching did no damage (1,900 bot hits on bots reached the server in a minute; ~40 counted). Your game's reports of
; bot-vs-bot hits are then ignored (no double damage) - except one that kills on your screen but never happened on
; the server: that one kills the bot on the server too (else it went on fighting as a limp body). Bot hits on you are
; unchanged. 0 = the game's own behaviour.
BotHitsOnBotsByServer=1
; 1 = a bot's bullets do a player's damage. The offline match uses campaign rules, where an AI shooter's damage is x
; its weapon's AI multiplier: "friendly" for team 1, the normal one for team 2 - team 2's support bots did about 40%
; (8 a hit against team 1's 21), on bots and on you. 0 = the game's own behaviour.
BotBulletsAsPlayers=1
; Your game follows the server's health for bots, as it does for a remote player's soldier. Off, it runs its own
; estimate for them and can show a bot dead that the server still has alive: a ragdoll moving about.
BotHealthFromServer=1
; Your melee can stealth-kill a bot (the instant kill it does on a real player). 0 = only the normal melee hit.
StealthMeleeOnBots=1
; With BotHealthFromServer on, this only logs when your game's estimate says dead and the server doesn't. With it off:
; milliseconds a bot may lie dead on your screen while the server still has it alive before the server kills it too.
; 0 = never.
LimpBodyKillMs=500

[brain]
; Bot behaviour (a native port of the fun-bots infantry logic). F9 pauses / resumes it in game.
Enabled=1
; 0-100: scales aim error, recoil control and reaction time (was 50)
SkillPercent=40
; how fast a bot can turn its aim (was 420: bots spun round and shot you as soon as they noticed you)
TurnDegreesPerSecond=240
; aim error at skill 50: shots land within about this many cm of the aim point at long range, and much closer up
; close (the angle is this / (distance + 10 m)), so bots no longer spray past each other at 3-10 m
AimErrorCentimeters=110
; right after acquiring a target the error is up to 3x, fading over this time (first shots after a turn go wide)
AimSettleMs=900
; simulated recoil climb while firing (bots don't get the game's own kick); skill decides how much they pull down.
; Was 100: with the weapon's own spread on top it sent most of a burst over the target's head.
RecoilPercent=40
; Noticing: an enemy in view has to stay in sight this long (straight ahead, within 10 m, moving, standing; scaled by
; skill: x1.1 at 40) before a bot notices it and turns to it. Longer: up to 3x at the edge of the field of view, +1x
; per 25 m beyond 10 m, 1.5x crouched, 2.5x prone, 1.3x standing still; 0.8x sprinting, and a third of it while
; firing. Breaking line of sight lets it fade over 3 s. (Replaces PeripheralDelayMs / NoticeMsPer10m.)
NoticeMs=450
; then the delay before its first shot (scaled by skill)
ReactionMinMs=350
ReactionMaxMs=850
; engage enemies within this many metres (sniper kits use SniperShootDistance)
ShootDistance=90
SniperShootDistance=220
; 1 = always aim at the head; 0 = chest, except snipers, who go for the head about SkillPercent of the time
AimForHead=0
; a soldier that spawned less than this long ago can't be noticed at all; noticing and the reaction time come on top
; (was 1500 as extra reaction time; a fall-back spawn in an enemy's view still got you shot at ~2 s)
SpawnGraceMs=2000
; a sniper's scope-in / settle time before the first shot at a new target (plus 0.4 s per 100 m)
SniperSettleMs=800
; field of view for spotting enemies (fun-bots uses 160, which noticed you almost from the side)
FovDegrees=120
; Hearing, outside the field of view: a bot turns to look toward an enemy it hears (it still has to see and notice
; it). Gunfire, and footsteps: sprinting, running upright, walking or crouch-running; crouched and slow, or prone,
; makes no noise. (Replaces HearingMeters, which noticed anyone within 5 m whatever they did.)
HearGunfireMeters=30
HearSprintMeters=10
HearRunMeters=5
HearWalkMeters=2
; aim error against other bots, % of the error against you (was 60 while the server dropped bot-vs-bot hits)
BotTargetAimErrorPercent=100
; a bot found stuck for this many seconds without getting 5 m from where it got stuck (every way out has failed:
; a hole it can't climb out of, say) changes class to get out, as a player would: the game's own class-change
; suicide, then it respawns as itself 5 s later. 0 = never
StuckChangeClassSeconds=15
; flashbangs: a bot that sees one go off within FlashbangMeters is blind and deaf for up to FlashbangBlindMs (point
; blank, looking straight at it; less further away, down to 30% with its back turned) - it loses its target, holds
; its fire and stumbles back. Any team's flashbang, as for players.
FlashbangMeters=15
FlashbangBlindMs=5000
; smoke grenades' clouds block bots' sight (as long as the game's smoke screen lasts, shrinking as it does)
SmokeBlocksSight=1
; chance a bot throws a grenade when the enemy it was fighting ducks into cover 8-25 m away (15-25 s cooldown)
GrenadePercent=35
; 1 = log targets acquired/lost, grenades, getting stuck, failed routes, and a one-off aim check per bot
LogEvents=1

[nav]
; Bot navigation learned from where you walk: a node every NodeSpacingCm, linked along your route, saved per map and
; game mode in the mohw-bots-nav folder next to this file. Bots plan routes over it (A*); where you haven't walked
; yet they head straight for the enemy as before. The more you play a map, the better bots get around it.
Enabled=1
; 1 = human players add to the graph while they play
LearnFromPlayers=1
; 1 = bots add to it too (how routes out of rooms you never walked through get learned)
LearnFromBots=1
NodeSpacingCm=250
; write the graph to disk this often while it's growing (and when the map changes)
SaveSeconds=30
MaxNodes=8000

[scoring]
; Offline, nothing scored (0 points, empty special-ability bar): the game's score events come from the online stats
; service. 1 = the DLL sends them for kills and headshots instead, with the game's own values (mohw/persistence/
; scoring/scoring): the round score, the "+100 KILL" popups, the fireteam buddy bonus and the support-action meter
; (first action at 400 points). Objectives score the same way, with the game's values: a charge armed or disarmed in
; Combat Mission and Hot Spot (+200, and the armed / disarmed count on the end-of-round screen), the charge going off
; and the objective falling (+50 / +100), Home Run's flag stolen, brought home or its carrier killed.
Enabled=1
KillPoints=100
HeadshotPoints=50

[spotting]
; Minimap. Spots come from each player's game reporting what it sees; bots have none, so enemy bots never showed up.
; 1 = an enemy bot that fires is spotted for you, as the game's own addSpot does it. FireSpotType: 3 = minimap only
; (the MQ-9 UAV's spot), 1 = passive, 0 = active (also the red marker over their head).
RevealOnFire=1
FireSpotType=3
; 1 = your bots spot the enemies they can see, as a human teammate's game would (SightSpotType as above)
FriendlyBotsSpot=1
SightSpotType=1
; 1 = also spot them in your game directly, as your game does when you spot someone (ClientSpotType: 3 = minimap,
; 0 = also the marker over their head; the minimap ignores passive). Not needed any more: the server spots do reach
; your game - the minimap itself skipped enemy AI (see ShowEnemyBotsOnMinimap).
ClientSpots=0
ClientSpotType=3
; 1 = patch the minimap's "never draw an enemy AI soldier" check (a campaign rule; bots are AI players), so a spotted
; enemy bot - fired, UAV, spotted by a teammate - is drawn like an enemy human
ShowEnemyBotsOnMinimap=1
; 1 = log what your game's spotting lists hold every 5 s (first 2 minutes, then every 30 s)
ClientDiagnostics=1
; 1 = force the game preset's NoMinimap / NoMinimapSpotting / No3dSpotting (SyncedBFSettings) and HudNoMinimap
; (SyncedMOHWSettings) off: the HUD hides every spotted enemy, UAV included, while NoMinimapSpotting is set
ForceMinimapSpotting=1

[combatlog]
; once a minute per bot (and you): shots, hits, accuracy, damage, hits on you, kills, headshot kills
Enabled=1
; every hit you land on a bot, merged per burst, with its health before and after
LogYourHits=1

[launch]
; The map offline mode starts (launch lanmohw.exe with NO arguments: the game then adds "-webmode spoffline" itself -
; any argument you pass makes it hand off to the EA app instead - and the DLL adds the level). One map code, or several
; comma-separated that take turns, one per launch (the next is remembered in mohw-bots-state.ini). Team Deathmatch
; maps (names as ProCon's MOHW.def has them): MP_03 Somalia Stronghold, MP_05 Novi Grad Warzone, MP_10 Sarajevo
; Stadium, MP_12 Basilan Aftermath, MP_13 Hara Dunes, MP_16 Al Fara Cliffside, MP_18 Shogore Valley, MP_19 Tungawan
; Jungle; expansion: MP_20 Darra Gun Market, MP_21 Chitral Compound. Bots learn a new map's routes as you (and they)
; walk it. Empty = no level (the normal main menu / campaign, or whatever StartupArgs says). This install has MP_03,
; MP_05, MP_10, MP_12, MP_13, MP_16, MP_18 and MP_19 (Data\Win32\MOHW\Levels\MP), each with a TDM layer.
; An entry can name its game mode after a colon, e.g. Map=MP_05,MP_03:SectorControl,MP_10:Sport. Without one it plays
; Mode below. The modes (the game's names, also ProCon's): TeamDeathMatch, SectorControl, CombatMission, BombSquad
; (Hot Spot) and Sport (Home Run). Every map has the first three; Novi Grad (MP_05) has no Home Run and Basilan (MP_12)
; no Hot Spot. An entry with a mode its map doesn't have plays Team Deathmatch. ProCon's Maplist tab edits this list.
; Bots capture Sector Control's flags; in Combat Mission, Hot Spot and Home Run they only fight (you do the objectives).
Map=MP_05,MP_03,MP_10,MP_12
; The game mode of entries in Map that don't name one.
Mode=TeamDeathMatch
; How much longer a round runs, in percent of the mode's win target (BF3's vars.gameModeCounter). Team Deathmatch
; is 75 kills per team or 10 minutes; with 20 players 75 kills took 5 minutes. 200 = 150 kills, so the 10-minute
; timer usually ends it. 0 = the game's own (100).
GameModeCounter=200
; Seconds after a round ends (the results screen) until the next entry of Map loads, as ProCon's Next Round does: in
; place, or restarting the game if that doesn't work ([rcon] NextRoundInPlace). Needs [rcon] Enabled=1. Offline MOHW
; never moves on by itself. 0 = stay on the results screen until you quit.
NextRoundSeconds=30
; 1 = the server may kick you for being idle (about 5 minutes without moving, the deploy screen included) or for team
; kills (Hardcore). You are the only human, so a kick ends the whole match. 0 = never (the game's kick settings are 0).
IdleKick=0
TeamKillKick=0
; Extra startup arguments, added after the level. With no Map, the whole set, e.g.
;   StartupArgs=-level MOHW/Levels/MP/MP_03/MP_03 -Game.DefaultLayerInclusion GameMode=TeamDeathMatch
StartupArgs=
; 1 = never start the Origin SDK (VeniceOnlineSettings.EnableOrigin forced off). Needed for StartupArgs with an MP
; level, otherwise the game launches the EA app and exits. Set 0 to use the LAN pack's emulated Origin (BFUlauncher).
DisableOrigin=1
; 1 = every server uses the local backend (as the campaign does). An MP level's server otherwise asks for the Blaze
; backend, which isn't registered offline, and the game crashes ~7 s after start. Set 0 to host through real Blaze.
ForceLocalServerBackend=1
; Client and server connection timeouts in seconds (game default 5). An MP level takes ~13 s to load on the local
; server, so with 5 s the client disconnects and you get a black screen. 0 = keep the game's values.
ConnectionTimeoutSeconds=300
; How many times (0.5 s apart) a connecting client resends its challenge before giving up with "no reply" (game
; default 15 = 7.5 s, max 127). The local server can't answer while it loads an MP level (~13 s), so with the default
; the client disconnects and you get a black screen. 0 = keep the game's value.
ChallengeRetries=120
; 1 = the client connects to the in-process server directly (as the game does for its front-end level) instead of
; over UDP to itself. Over UDP the server's level load stalls until the client gives up: black screen. Set 0 to join
; a server on another machine.
LocalClientLink=1
; Written into GameSettings.DefaultLayerInclusion ("Criterion=Value;..."); picks the level's game-mode layer
; (teams, spawn points, rules). Empty = "GameMode=<Mode>" when Map is set, else the game's own value.
LayerInclusion=

[hardcore]
; Battlefield 3's Hardcore preset. 1 = on, for every launch. Each rule below can be changed on its own.
Enabled=0
; 1 = bullets and grenades hurt teammates. Bots hold fire while a teammate is in the way, and don't throw grenades near one.
FriendlyFire=1
; 0 = no health comes back
RegenerateHealth=0
; Soldiers spawn with this percentage of their health, you and the bots
SoldierHealth=60
; 0 = no kill cam
KillCam=0
; 0 = HUD off except the minimap: no crosshair, health, ammo, kill feed, score or ability meter
Hud=0
; 0 = no name tags, and no outline on your fireteam buddy
NameTag=0
; 0 = spotted enemies don't get a marker in the world. The minimap still shows them, as in BF3's Hardcore.
Spotting3D=0
; 1 = you can only spawn on your fireteam buddy if they lead the fireteam. Bots follow the same rule.
OnlySquadLeaderSpawn=1

[rcon]
; ProCon: a small Frostbite RCON server inside the game, so ProCon can connect to your offline match. In ProCon add a
; server with host 127.0.0.1 (or localhost) and this port. 0 = off.
Enabled=1
Port=47200
; 127.0.0.1 = only this PC can connect. To use ProCon from another PC set your LAN address or 0.0.0.0, and a Password.
Bind=127.0.0.1
; Empty = any password ProCon sends is accepted (fine on 127.0.0.1).
Password=
; The name ProCon shows.
ServerName=mohw-bots
; ProCon's Next Round / Restart Round (and a double-click in its Maplist tab): 1 = load the map in place, the game stays
; open (if that doesn't come in within a couple of minutes, the game restarts with the map instead). 0 = always restart
; the game with it.
NextRoundInPlace=1

[debug]
; 1 = log the first time each engine message type is dispatched (shows where a load or join stops), plus a count of
; each type once a minute.
TraceMessages=1
